name: Publish verified update manifest

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Build and publish release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hardwarescope-update-manifest
  cancel-in-progress: false

jobs:
  publish-manifest:
    if: >-
      ${{
        (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Resolve the public stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_TAG:-}" ]]; then
            TAG="$EVENT_TAG"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          # Pre-2.0.5 clients only accept this owner. Verify its redirect/download
          # below; current clients accept both paths. Keep existing users upgradable.
          UPDATE_DOWNLOAD_REPOSITORY: Aydren1/HardwareScope
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          INSTALLER="HardwareScope-Setup-${VERSION}-x64.exe"

          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$INSTALLER" \
            --pattern "SHA256SUMS.txt" \
            --dir release-assets

          # Release checksums may be generated on Windows and use CRLF endings.
          # Strip the carriage return before comparing the asset filename.
          EXPECTED_HASH="$(tr -d '\r' < release-assets/SHA256SUMS.txt | awk -v file="$INSTALLER" '$2 == file { print toupper($1) }')"
          ACTUAL_HASH="$(sha256sum "release-assets/$INSTALLER" | awk '{ print toupper($1) }')"
          test -n "$EXPECTED_HASH"
          test "$ACTUAL_HASH" = "$EXPECTED_HASH"

          SIZE="$(stat -c%s "release-assets/$INSTALLER")"
          INSTALLER_URL="https://github.com/${UPDATE_DOWNLOAD_REPOSITORY}/releases/download/${TAG}/${INSTALLER}"
          curl --fail --location --silent --show-error --output release-assets/public-installer.exe "$INSTALLER_URL"
          PUBLIC_HASH="$(sha256sum release-assets/public-installer.exe | awk '{ print toupper($1) }')"
          test "$PUBLIC_HASH" = "$ACTUAL_HASH"

          mkdir -p updates
          printf '%s\n' \
            '{' \
            "  \"version\": \"$VERSION\"," \
            '  "channel": "stable",' \
            "  \"published\": \"$(date -u +%F)\"," \
            "  \"installer\": \"$INSTALLER_URL\"," \
            "  \"sha256\": \"$ACTUAL_HASH\"," \
            "  \"size\": $SIZE," \
            "  \"releaseNotes\": \"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}\"" \
            '}' > updates/latest.json

      - name: Commit verified manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- updates/latest.json; then
            echo "The verified update manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Publish verified update manifest for ${{ steps.release.outputs.tag }}"
          git push origin HEAD:main
