name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure x64 Release
        run: >-
          cmake -S . -B out/build/x64-release
          -A x64
          -DBUILD_TESTING=ON

      - name: Build x64 Release
        shell: pwsh
        run: |
          $targets = @(
            'HardwareScopeNative',
            'HardwareScopeNativeSensorService',
            'HardwareScopeNativeTests',
            'HardwareScopeNativeUpdaterRecoveryTests'
          )
          foreach ($target in $targets) {
            cmake --build out/build/x64-release --config Release --target $target
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $target" }
          }

      - name: Run deterministic tests
        run: ctest --test-dir out/build/x64-release -C Release --output-on-failure

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build and validate clean installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'out/build/x64-release/HardwareScope.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $installer = Get-ChildItem out/packages/HardwareScope-Setup-*-x64.exe
          if (@($installer).Count -ne 1) { throw 'Expected exactly one installer.' }
          ./tests/clean_install_validation.ps1 -InstallerPath $installer.FullName

      - name: Keep installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-diagnostics
          path: ${{ runner.temp }}/HardwareScope-*.log
          if-no-files-found: ignore
